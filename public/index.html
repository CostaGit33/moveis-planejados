<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moveis Planejados MVP</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>Moveis Planejados</h1>
        <p>MVP local: pedido, planta, 3D simples, pecas e orcamento.</p>
      </div>
      <div class="actions">
        <button id="loadBase" type="button">Carregar POC</button>
        <button id="simulateFlow" type="button">Simular Fluxo</button>
        <button id="exportJson" type="button">Exportar JSON</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel input-panel">
        <h2>Pedido</h2>
        <label>
          Solicitacao do cliente
          <textarea id="pedido" rows="5">Quero uma cozinha linear de 3,20 m com armario inferior de 600 mm, bancada e acabamento MDF areia.</textarea>
        </label>

        <div class="grid two">
          <label>
            Largura ambiente (mm)
            <input id="ambienteLargura" type="number" min="1000" value="3200">
          </label>
          <label>
            Profundidade ambiente (mm)
            <input id="ambienteProfundidade" type="number" min="600" value="800">
          </label>
          <label>
            Pe-direito (mm)
            <input id="peDireito" type="number" min="1800" value="2700">
          </label>
          <label>
            Parede espessura (mm)
            <input id="paredeEspessura" type="number" min="60" value="120">
          </label>
        </div>

        <h2>Modulo</h2>
        <div class="grid two">
          <label>
            Tipo
            <select id="moduloTipo">
              <option value="armario_inferior">Armario inferior</option>
            </select>
          </label>
          <label>
            Material
            <select id="material">
              <option value="mdf_areia">MDF Areia</option>
              <option value="mdf_cinza">MDF Cinza</option>
              <option value="mdf_carvalho">MDF Carvalho</option>
            </select>
          </label>
          <label>
            X (mm)
            <input id="moduloX" type="number" min="0" value="300">
          </label>
          <label>
            Y (mm)
            <input id="moduloY" type="number" min="0" value="120">
          </label>
          <label>
            Largura (mm)
            <input id="moduloLargura" type="number" min="200" value="600">
          </label>
          <label>
            Profundidade (mm)
            <input id="moduloProfundidade" type="number" min="200" value="600">
          </label>
          <label>
            Altura (mm)
            <input id="moduloAltura" type="number" min="200" value="720">
          </label>
          <label>
            Chapa (mm)
            <input id="chapa" type="number" min="6" value="18">
          </label>
        </div>
      </section>

      <section class="panel preview-panel">
        <div class="panel-title">
          <h2>Planta 2D</h2>
          <span id="dimensoesResumo"></span>
        </div>
        <canvas id="planta2d" width="720" height="430"></canvas>
      </section>

      <section class="panel preview-panel">
        <div class="panel-title">
          <h2>Visao 3D</h2>
          <span>Canvas local</span>
        </div>
        <canvas id="visao3d" width="720" height="430"></canvas>
      </section>

      <section class="panel output-panel">
        <div>
          <h2>Lista de Pecas</h2>
          <table>
            <thead>
              <tr>
                <th>Peca</th>
                <th>Medida</th>
                <th>Material</th>
              </tr>
            </thead>
            <tbody id="pecasBody"></tbody>
          </table>
        </div>

        <div class="summary">
          <h2>Orcamento</h2>
          <dl>
            <div>
              <dt>Area MDF</dt>
              <dd id="areaMdf">0 m2</dd>
            </div>
            <div>
              <dt>Estimativa</dt>
              <dd id="valorEstimado">R$ 0,00</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd id="statusProjeto">Pronto para validacao</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="panel flow-panel">
        <div class="panel-title">
          <h2>Fluxo Esperado</h2>
          <span id="flowStatus">Conectores locais</span>
        </div>
        <div class="flow-grid" id="flowGrid"></div>
        <pre id="flowPayload">{}</pre>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
